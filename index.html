<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para alguien especial ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1a1a1a;
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Pantalla inicial con la foto completa, sin bordes negros y con efecto difuminado sutil */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('ingri_07.jpg');
            background-size: cover;
            background-position: center center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        /* Capa de fondo difuminada para que cubra toda la pantalla sin barras negras */
        #welcome-screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: inherit;
            background-size: cover;
            background-position: center center;
            filter: blur(6px);
            transform: scale(1.1);
            z-index: -1;
        }

        .flower-container {
            text-align: center;
            cursor: pointer;
            animation: pulse 2s infinite;
            z-index: 2;
        }

        .flower-container img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .flower-container p {
            color: white;
            font-size: 1.2rem;
            margin-top: 15px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
            font-weight: 500;
        }

        /* Contenido Principal con la foto de fondo visible y difuminada */
        #main-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 100vh;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 30px 20px;
            opacity: 0;
            transition: opacity 1s ease;
            background-image: linear-gradient(rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.3)), url('ingri_07.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        h1 {
            color: #b7091c;
            margin: 20px 0;
            font-size: 2rem;
            text-align: center;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.9);
        }

        /* Galería principal adaptativa */
        .gallery-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 30px;
            transition: filter 0.5s ease;
        }

        .card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            flex: 1;
            height: 480px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            transition: transform 0.4s ease, box-shadow 0.4s ease, filter 0.5s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
        }

        .image-wrapper {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover img {
            transform: scale(1.05);
        }

        /* --- VISTA EXPANDIDA --- */
        #modal-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4); 
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.4s ease;
            padding: 15px;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.1); 
            width: 100%;
            max-width: 950px;
            height: 500px;
            border-radius: 25px;
            display: flex; 
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            position: relative;
            transform: scale(0.8);
            transition: transform 0.4s ease;
        }

        .modal-image {
            width: 55%;
            height: 100%;
            background: #000;
        }

        .modal-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-text {
            width: 45%;
            height: 100%;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-color: rgba(255, 230, 235, 0.25); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
        }

        .modal-text h2 {
            color: #b7091c;
            margin-bottom: 15px;
            font-size: 1.8rem;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.8);
        }

        .modal-text p {
            color: #222;
            font-size: 1rem;
            line-height: 1.5;
            font-weight: 500;
            text-shadow: 0 1px 3px rgba(255, 255, 255, 0.8);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ff4d6d;
            color: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: background 0.3s, transform 0.2s;
        }

        .close-btn:hover {
            background: #d90429;
            transform: scale(1.1);
        }

        /* Botón para regresar a la flor */
        #back-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: background 0.3s, transform 0.3s;
            z-index: 10;
        }

        #back-btn:hover {
            background-color: #d90429;
            transform: scale(1.05);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .split-animation {
            opacity: 0;
            transform: scale(1.2);
            pointer-events: none;
        }

        /* --- DISEÑO ADAPTATIVO PARA CELULARES --- */
        @media (max-width: 768px) {
            .gallery-container {
                flex-direction: column;
                height: auto;
                gap: 15px;
            }

            .card {
                width: 100%;
                max-width: 320px;
                height: 350px;
            }

            .modal-content {
                flex-direction: column;
                height: 85vh;
                max-width: 350px;
            }

            .modal-image {
                width: 100%;
                height: 45%;
            }

            .modal-text {
                width: 100%;
                height: 55%;
                padding: 20px;
                border-left: none;
                border-top: 1px solid rgba(255, 255, 255, 0.2);
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Pantalla de la Flor Amarilla con imagen de fondo personalizada -->
    <div id="welcome-screen">
        <div class="flower-container" onclick="openGift()">
            <img src="https://images.unsplash.com/photo-1597848212624-a19eb35e2651?auto=format&fit=crop&q=80&w=400" alt="Girasol">
            <p>Hazle Click🌻</p>
        </div>
    </div>

    <!-- Contenido Principal con la foto de fondo visible y difuminada -->
    <div id="main-content">
        <h1>Momentos Especiales Contigo</h1>
        
        <div class="gallery-container" id="gallery">
            <!-- Foto 1 -->
            <div class="card" onclick="openDetail('ingri_01.jpg', 'Preciosa', 'Hola se que me demore mucho haciendo esta pequeña sorpresa aun no me cuadraba del todo, por que me faltan mas fotos  como estas, no tenia muchas para poder crear mejor la pagina, la proxima tratare de hacerlo mejor jeje...')">
                <div class="image-wrapper">
                    <img src="ingri_01.jpg" alt="Foto 1">
                </div>
            </div>

            <!-- Foto 2 -->
            <div class="card" onclick="openDetail('ingri_02.jpg', 'Sapito', 'Esta fotito me encanta por que veo lo fantastica que eres siendo tu misma, me agrada mucho poder conocerte y ver cada mueca de tu rostro jeje y las fotos inesperadas de ti son las que mas me gustan.')">
                <div class="image-wrapper">
                    <img src="ingri_02.jpg" alt="Foto 2">
                </div>
            </div>

            <!-- Foto 3 -->
            <div class="card" onclick="openDetail('ingri_03.jpg', 'Yngrid', 'Gracias por darme abrazos cuando mas lo necesitaba y estas fotos de aqui me recuerdan mucho a ese dia que me diste esos abrazos y anque no haya sido el mismo dia lo recuerdo , espero te guste mucho este detalle te quiero.')">
                <div class="image-wrapper">
                    <img src="ingri_03.jpg" alt="Foto 3">
                </div>
            </div>
        </div>
    </div>

    <!-- Visor Detallado -->
    <div id="modal-view">
        <div class="modal-content" id="modal-box">
            <button class="close-btn" onclick="closeDetail()">×</button>
            <div class="modal-image">
                <img id="modal-img" src="" alt="Imagen Ampliada">
            </div>
            <div class="modal-text">
                <h2 id="modal-title"></h2>
                <p id="modal-desc"></p>
            </div>
        </div>
    </div>

    <!-- Botón para regresar a la flor -->
    <button id="back-btn" onclick="goBackToFlower()" style="display: none;">🌻 Volver al inicio</button>

    <script>
        function openGift() {
            const welcomeScreen = document.getElementById('welcome-screen');
            const mainContent = document.getElementById('main-content');
            const backBtn = document.getElementById('back-btn');

            welcomeScreen.classList.add('split-animation');

            setTimeout(() => {
                welcomeScreen.style.display = 'none';
                mainContent.style.display = 'flex';
                mainContent.style.opacity = '1';
                backBtn.style.display = 'block';
            }, 800);
        }

        function goBackToFlower() {
            const welcomeScreen = document.getElementById('welcome-screen');
            const mainContent = document.getElementById('main-content');
            const backBtn = document.getElementById('back-btn');
            closeDetail();

            welcomeScreen.style.display = 'flex';
            welcomeScreen.classList.remove('split-animation');
            welcomeScreen.style.opacity = '1';

            mainContent.style.display = 'none';
            mainContent.style.opacity = '0';
            backBtn.style.display = 'none';
        }

        function openDetail(imgSrc, title, desc) {
            const modal = document.getElementById('modal-view');
            const modalBox = document.getElementById('modal-box');
            const gallery = document.getElementById('gallery');

            document.getElementById('modal-img').src = imgSrc;
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;

            gallery.style.filter = 'blur(8px)';

            modal.style.display = 'flex';
            setTimeout(() => {
                modal.style.opacity = '1';
                modalBox.style.transform = 'scale(1)';
            }, 10);
        }

        function closeDetail() {
            const modal = document.getElementById('modal-view');
            const modalBox = document.getElementById('modal-box');
            const gallery = document.getElementById('gallery');

            modal.style.opacity = '0';
            modalBox.style.transform = 'scale(0.8)';
            gallery.style.filter = 'none';

            setTimeout(() => {
                modal.style.display = 'none';
            }, 400);
        }
    </script>

</body>
</html>
